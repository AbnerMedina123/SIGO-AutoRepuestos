<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-label="Suspensión">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#0e0e0e"/></linearGradient>
  <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#888"/><stop offset="0.5" stop-color="#e2e2e2"/><stop offset="1" stop-color="#888"/></linearGradient></defs>
  <rect width="600" height="500" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#ff6a00" stroke-width="16"><line x1="-60" y1="140" x2="260" y2="-60"/><line x1="340" y1="600" x2="700" y2="160"/></g>
  <!-- shock absorber with coil spring -->
  <g transform="translate(300 250)">
    <rect x="-18" y="-180" width="36" height="70" rx="10" fill="url(#rod)"/>
    <circle cx="0" cy="-185" r="22" fill="#444" stroke="#666" stroke-width="4"/><circle cx="0" cy="-185" r="8" fill="#1a1a1a"/>
    <!-- coil -->
    <g fill="none" stroke="#ff6a00" stroke-width="16" stroke-linecap="round">
      <path d="M-55,-110 L55,-90"/><path d="M-55,-70 L55,-50"/><path d="M-55,-30 L55,-10"/><path d="M-55,10 L55,30"/><path d="M-55,50 L55,70"/>
    </g>
    <rect x="-30" y="80" width="60" height="100" rx="14" fill="#3a3a3a" stroke="#555" stroke-width="4"/>
    <circle cx="0" cy="185" r="22" fill="#444" stroke="#666" stroke-width="4"/><circle cx="0" cy="185" r="8" fill="#1a1a1a"/>
  </g>
  <text x="300" y="480" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#ff6a00" letter-spacing="2">SUSPENSIÓN</text>
</svg>
