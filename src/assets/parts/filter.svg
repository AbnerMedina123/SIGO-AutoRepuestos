<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-label="Filtro">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#0e0e0e"/></linearGradient>
  <linearGradient id="can" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6fb3"/><stop offset="0.5" stop-color="#4a90d9"/><stop offset="1" stop-color="#2f6fb3"/></linearGradient></defs>
  <rect width="600" height="500" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#ff6a00" stroke-width="16"><line x1="-60" y1="140" x2="260" y2="-60"/><line x1="340" y1="600" x2="700" y2="160"/></g>
  <!-- oil filter canister -->
  <g transform="translate(300 250)">
    <rect x="-90" y="-130" width="180" height="260" rx="28" fill="url(#can)"/>
    <rect x="-90" y="-130" width="180" height="40" rx="20" fill="#d8dde2"/>
    <g stroke="#1f4d80" stroke-width="4" opacity="0.5">
      <line x1="-90" y1="-40" x2="90" y2="-40"/><line x1="-90" y1="10" x2="90" y2="10"/><line x1="-90" y1="60" x2="90" y2="60"/>
    </g>
    <rect x="-55" y="-70" width="110" height="60" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="-42" y="-58" width="84" height="10" rx="4" fill="#ff6a00"/>
    <rect x="-42" y="-40" width="60" height="7" rx="3" fill="#8a8a8a"/>
    <rect x="-42" y="-28" width="70" height="7" rx="3" fill="#8a8a8a"/>
  </g>
  <text x="300" y="470" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#ff6a00" letter-spacing="2">FILTROS</text>
</svg>
