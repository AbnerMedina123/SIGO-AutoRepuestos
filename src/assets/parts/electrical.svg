<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-label="Sistema eléctrico">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#0e0e0e"/></linearGradient>
  <radialGradient id="alt" cx="0.4" cy="0.4" r="0.7"><stop offset="0" stop-color="#9a9a9a"/><stop offset="1" stop-color="#4a4a4a"/></radialGradient></defs>
  <rect width="600" height="500" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#ff6a00" stroke-width="16"><line x1="-60" y1="140" x2="260" y2="-60"/><line x1="340" y1="600" x2="700" y2="160"/></g>
  <!-- alternator body -->
  <g transform="translate(290 250)">
    <circle r="130" fill="url(#alt)" stroke="#333" stroke-width="6"/>
    <g stroke="#2a2a2a" stroke-width="6" opacity="0.6">
      <line x1="-130" y1="0" x2="130" y2="0"/><line x1="0" y1="-130" x2="0" y2="130"/>
      <line x1="-92" y1="-92" x2="92" y2="92"/><line x1="-92" y1="92" x2="92" y2="-92"/>
    </g>
    <circle r="48" fill="#333"/><circle r="22" fill="#1a1a1a"/>
    <!-- pulley -->
    <g transform="translate(-150 0)"><circle r="42" fill="#555" stroke="#777" stroke-width="4"/><circle r="18" fill="#1a1a1a"/></g>
  </g>
  <!-- lightning accent -->
  <path transform="translate(430 150)" d="M20,0 L-14,46 L6,46 L-16,96 L34,34 L10,34 Z" fill="#ff6a00"/>
  <text x="300" y="475" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#ff6a00" letter-spacing="1">SIST. ELÉCTRICO</text>
</svg>
