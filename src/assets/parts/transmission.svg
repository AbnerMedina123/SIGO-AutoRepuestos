      <path d="M-150,0 A150,150 0 0 1 -106,-106 L-70,-70 A100,100 0 0 0 -100,0 Z"/>
    </g>
    <circle r="60" fill="#444" stroke="#666" stroke-width="4"/>
    <g fill="#ff6a00"><circle cx="0" cy="-40" r="8"/><circle cx="38" cy="12" r="8"/><circle cx="-38" cy="12" r="8"/></g>
    <circle r="20" fill="#1a1a1a"/>
    <g stroke="#1a1a1a" stroke-width="6"><line x1="-20" y1="0" x2="20" y2="0"/><line x1="0" y1="-20" x2="0" y2="20"/></g>
  </g>
  <text x="300" y="470" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#ff6a00" letter-spacing="1">TRANSMISIÓN</text>
