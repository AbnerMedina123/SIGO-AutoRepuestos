<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-label="Motor">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#0e0e0e"/></linearGradient></defs>
  <rect width="600" height="500" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#ff6a00" stroke-width="16"><line x1="-60" y1="140" x2="260" y2="-60"/><line x1="340" y1="600" x2="700" y2="160"/></g>
  <!-- engine block -->
  <g transform="translate(300 250)">
    <rect x="-150" y="-40" width="300" height="150" rx="14" fill="#333"/>
    <rect x="-150" y="-40" width="300" height="150" rx="14" fill="none" stroke="#4a4a4a" stroke-width="4"/>
    <!-- cylinder heads -->
    <g fill="#444">
      <rect x="-140" y="-110" width="60" height="80" rx="8"/>
      <rect x="-70" y="-110" width="60" height="80" rx="8"/>
      <rect x="0" y="-110" width="60" height="80" rx="8"/>
      <rect x="70" y="-110" width="60" height="80" rx="8"/>
    </g>
    <g fill="#ff6a00"><circle cx="-110" cy="-120" r="10"/><circle cx="-40" cy="-120" r="10"/><circle cx="30" cy="-120" r="10"/><circle cx="100" cy="-120" r="10"/></g>
    <!-- ribs -->
    <g stroke="#222" stroke-width="5"><line x1="-150" y1="0" x2="150" y2="0"/><line x1="-150" y1="30" x2="150" y2="30"/><line x1="-150" y1="60" x2="150" y2="60"/><line x1="-150" y1="90" x2="150" y2="90"/></g>
    <rect x="-40" y="-20" width="80" height="26" rx="6" fill="#555"/>
    <circle cx="140" cy="75" r="26" fill="#ff6a00"/><circle cx="140" cy="75" r="12" fill="#1a1a1a"/>
  </g>
  <text x="300" y="470" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#ff6a00" letter-spacing="2">MOTOR</text>
</svg>
