<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-label="Frenos">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#0e0e0e"/></linearGradient></defs>
  <rect width="600" height="500" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#ff6a00" stroke-width="16"><line x1="-60" y1="140" x2="260" y2="-60"/><line x1="340" y1="600" x2="700" y2="160"/></g>
  <!-- brake disc -->
  <g transform="translate(250 250)">
    <circle r="150" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="6"/>
    <circle r="150" fill="none" stroke="#555" stroke-width="2"/>
    <g stroke="#1a1a1a" stroke-width="3" opacity="0.7">
      <circle r="120" fill="none"/><circle r="95" fill="none"/><circle r="70" fill="none"/>
    </g>
    <circle r="50" fill="#1a1a1a"/>
    <g fill="#111"><circle cx="0" cy="-32" r="7"/><circle cx="30" cy="-10" r="7"/><circle cx="19" cy="26" r="7"/><circle cx="-19" cy="26" r="7"/><circle cx="-30" cy="-10" r="7"/></g>
  </g>
  <!-- brake caliper + pad -->
  <g transform="translate(395 185)">
    <rect x="0" y="0" width="150" height="130" rx="20" fill="#ff6a00"/>
    <rect x="18" y="22" width="90" height="86" rx="8" fill="#1a1a1a"/>
    <rect x="30" y="34" width="66" height="62" rx="4" fill="#3a3a3a"/>
  </g>
  <text x="300" y="470" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#ff6a00" letter-spacing="2">FRENOS</text>
</svg>
