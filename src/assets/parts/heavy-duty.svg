<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-label="Repuestos para pesados">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#0e0e0e"/></linearGradient></defs>
  <rect width="600" height="500" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#ff6a00" stroke-width="16"><line x1="-60" y1="140" x2="260" y2="-60"/><line x1="340" y1="600" x2="700" y2="160"/></g>
  <!-- truck -->
  <g transform="translate(300 250)">
    <!-- trailer -->
    <rect x="-200" y="-80" width="200" height="130" rx="8" fill="#333" stroke="#4a4a4a" stroke-width="4"/>
    <g stroke="#222" stroke-width="4"><line x1="-200" y1="-40" x2="0" y2="-40"/><line x1="-200" y1="0" x2="0" y2="0"/></g>
    <!-- cab -->
    <path d="M10,-80 L120,-80 L160,-20 L160,50 L10,50 Z" fill="#ff6a00"/>
    <rect x="30" y="-62" width="80" height="54" rx="6" fill="#bcd4e6"/>
    <rect x="120" y="-10" width="40" height="40" fill="#cc5500"/>
    <!-- wheels -->
    <g fill="#1a1a1a" stroke="#555" stroke-width="5">
      <circle cx="-150" cy="60" r="38"/><circle cx="-70" cy="60" r="38"/><circle cx="110" cy="60" r="38"/>
    </g>
    <g fill="#777"><circle cx="-150" cy="60" r="14"/><circle cx="-70" cy="60" r="14"/><circle cx="110" cy="60" r="14"/></g>
  </g>
  <text x="300" y="480" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#ff6a00" letter-spacing="1">PESADOS</text>
</svg>
