<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-label="Candela">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#0e0e0e"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#777"/><stop offset="0.5" stop-color="#cfcfcf"/><stop offset="1" stop-color="#777"/></linearGradient>
  <linearGradient id="cer" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9b48a"/><stop offset="0.5" stop-color="#f3e3cf"/><stop offset="1" stop-color="#d9b48a"/></linearGradient></defs>
  <rect width="600" height="500" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#ff6a00" stroke-width="16"><line x1="-60" y1="140" x2="260" y2="-60"/><line x1="340" y1="600" x2="700" y2="160"/></g>
  <!-- single spark plug (vertical) -->
  <g transform="translate(300 250)">
    <rect x="-28" y="-170" width="56" height="60" rx="8" fill="url(#metal)"/>
