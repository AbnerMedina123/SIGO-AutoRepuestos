    <path d="M-40,-40 L40,-40 L50,0 L-50,0 Z" fill="url(#metal)"/>
    <g stroke="#555" stroke-width="3"><line x1="-50" y1="-20" x2="50" y2="-20"/></g>
    <rect x="-24" y="0" width="48" height="90" fill="url(#metal)"/>
    <g stroke="#888" stroke-width="2" opacity="0.6"><line x1="-24" y1="18" x2="24" y2="18"/><line x1="-24" y1="36" x2="24" y2="36"/><line x1="-24" y1="54" x2="24" y2="54"/><line x1="-24" y1="72" x2="24" y2="72"/></g>
    <line x1="0" y1="90" x2="0" y2="130" stroke="#aaa" stroke-width="6"/>
    <path d="M18,110 L0,130 L18,130" fill="none" stroke="#aaa" stroke-width="6"/>
    <circle cx="9" cy="130" r="6" fill="#ff6a00"/>
  </g>
  <text x="300" y="470" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#ff6a00" letter-spacing="2">ENCENDIDO</text>
