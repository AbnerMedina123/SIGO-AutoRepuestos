<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-label="Accesorios">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#0e0e0e"/></linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#888"/><stop offset="0.5" stop-color="#e5e5e5"/><stop offset="1" stop-color="#777"/></linearGradient></defs>
  <rect width="600" height="500" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#ff6a00" stroke-width="16"><line x1="-60" y1="140" x2="260" y2="-60"/><line x1="340" y1="600" x2="700" y2="160"/></g>
  <!-- wrench -->
  <g transform="translate(300 250) rotate(-35)">
    <path d="M-30,-150 a52,52 0 1 0 60,60 L140,20 a30,30 0 0 1 -60,60 L-30,-30 Z" fill="url(#chrome)" stroke="#555" stroke-width="5"/>
    <circle cx="-6" cy="-96" r="26" fill="#1c1c1c"/>
  </g>
  <!-- screwdriver -->
  <g transform="translate(300 250) rotate(50)">
    <rect x="-16" y="-150" width="32" height="90" rx="12" fill="#ff6a00"/>
    <rect x="-8" y="-62" width="16" height="130" fill="url(#chrome)"/>
    <rect x="-8" y="60" width="16" height="30" fill="#555"/>
  </g>
  <text x="300" y="475" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#ff6a00" letter-spacing="1">ACCESORIOS</text>
</svg>
