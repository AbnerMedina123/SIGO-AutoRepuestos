# Configuración de despliegue para Netlify
# El sitio se construye con Vite y se publica la carpeta dist/.

[build]
  # Instala dependencias con npm (usando package-lock.json) y luego construye.
  # Forzamos npm para evitar que la plataforma intente usar pnpm.
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requiere Node 20+. Fijamos Node 22.
  NODE_VERSION = "22"
  # Evita que Netlify detecte/instale con pnpm o yarn automáticamente.
  NPM_FLAGS = "--no-audit --no-fund"

# Archivo de verificación de Google Search Console: servirlo tal cual,
# NO redirigirlo al SPA (debe entregar el .html de verificación exacto).
[[redirects]]
  from = "/google8eee1b829c5c6457.html"
  to = "/google8eee1b829c5c6457.html"
  status = 200
  force = true

# SPA fallback: cualquier ruta desconocida sirve index.html para que
# React Router maneje la navegación (evita 404 al refrescar /catalog, /admin, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================================================
# Cabeceras de seguridad HTTP (aplicadas a todas las respuestas)
# ============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Evita que el sitio se incruste en un <iframe> de otro dominio (clickjacking).
    X-Frame-Options = "DENY"
    # Impide que el navegador "adivine" el tipo MIME (previene algunos XSS).
    X-Content-Type-Options = "nosniff"
    # Controla cuánta información de referencia se envía a otros sitios.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Fuerza HTTPS durante 2 años (incluye subdominios).
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Desactiva APIs del navegador que el sitio no usa.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Content Security Policy: restringe de dónde se puede cargar cada recurso.
    # Incluye los dominios que la app realmente usa: Supabase (API/Storage),
    # Google Fonts y OAuth, Unsplash (imágenes), y datos/blobs locales.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://accounts.google.com https://challenges.cloudflare.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"
