# Análisis de Composición de Software (SCA) — revisa vulnerabilidades conocidas
# en las dependencias del proyecto (npm). Combina dos capas:
#   1. npm audit        -> rápido, nativo de npm; falla ante CVE de severidad alta.
#   2. OWASP Dependency-Check -> cruza las dependencias contra la base NVD/CVE y
#      publica un reporte en la pestaña Security (formato SARIF).
# Se ejecuta en cada push a main, en cada pull request y una vez por semana.

name: "SCA — Dependencias"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Lunes a las 06:30 UTC (análisis programado semanal).
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar dependencias (sin ejecutar scripts)
        run: npm ci --ignore-scripts

      # Falla el job si hay vulnerabilidades de severidad alta o crítica.
      # Las moderadas/bajas se reportan pero no bloquean.
      - name: npm audit (alta/crítica)
        run: npm audit --audit-level=high

      # --- Evidencia -------------------------------------------------------
      # Resumen legible en la página de la ejecución (pestaña "Summary").
      - name: Resumen de npm audit en la ejecución
        if: always()
        run: |
          {
            echo "### npm audit — $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Reporte completo en JSON, descargable desde "Artifacts".
      - name: Generar reporte JSON de npm audit
        if: always()
        run: npm audit --json > npm-audit-report.json || true

      - name: Guardar reporte de npm audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 90

  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      # Dependency-Check analiza mejor los proyectos Node cuando las
      # dependencias están instaladas (node_modules). Sin esto, la primera
      # versión de este workflow terminó con "Dependencies Scanned: 0".
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar dependencias (sin ejecutar scripts)
        run: npm ci --ignore-scripts

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "SIGO-AutoRepuestos"
          path: "."
          # ALL genera HTML (legible), JSON y SARIF (para la pestaña Security).
          format: "ALL"
          args: >
            --enableExperimental

      # Reportes completos (HTML/JSON/SARIF), descargables desde "Artifacts".
      - name: Guardar reportes de Dependency-Check
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: ${{ github.workspace }}/reports
          retention-days: 90

      # Control anti falso negativo: si el análisis no vio ninguna dependencia,
      # el "0 vulnerabilidades" no significa nada, así que el job debe fallar.
      - name: Verificar que Dependency-Check analizó dependencias
        run: |
          REPORT=reports/dependency-check-report.json
          TOTAL=$(jq '.dependencies | length' "$REPORT")
          VULN=$(jq '[.dependencies[] | select(.vulnerabilities != null)] | length' "$REPORT")
          {
            echo "### OWASP Dependency-Check"
            echo "- Dependencias analizadas: **${TOTAL}**"
            echo "- Dependencias con vulnerabilidades: **${VULN}**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::Dependency-Check analizó 0 dependencias; el resultado no es válido."
            exit 1
          fi

      - name: Subir reporte SARIF a Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "${{ github.workspace }}/reports/dependency-check-report.sarif"
